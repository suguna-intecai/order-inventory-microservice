syntax = "proto3";

package order;

service OrderService {
  rpc UpdateOrder(
    UpdateOrderRequest
  ) returns (
    UpdateOrderResponse
  );
}

message UpdateOrderRequest {
  int32 id = 1;
  optional int32 userId = 2;
  optional string status = 3;
  optional double price = 4;
  optional int32 quantity = 5;
}

message UpdateOrderResponse {
  Order order = 1;
}

message Order {
  int32 id = 1;
  int32 userId = 2;
  string status = 3;
  double price = 4;
  repeated OrderItem items = 5;
  string createdAt = 6;
  string updatedAt = 7;
}

message OrderItem {
  int32 id = 1;
  int32 orderId = 2;
  int32 productId = 3;
  int32 quantity = 4;
  double price = 5;
  string createdAt = 6;
}